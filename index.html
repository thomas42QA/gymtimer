<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');

:root {
  --work:  #00ff88;
  --rest:  #ff2244;
  --ready: #2979ff;
  --bg:    #080808;
  --card:  #101010;
  --dim:   #1a1a1a;
  --muted: #444;
  --text:  #efefef;
  --current: var(--ready);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Bebas Neue', sans-serif;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 0;
  overflow: hidden;
}

/* ── HEADER ─────────────────────────────────────────── */
.header {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px 0;
}
.logo {
  font-size: 1.6rem;
  letter-spacing: 6px;
  color: var(--text);
}
.logo span { color: var(--work); }

.wake-pill {
  display: flex; align-items: center; gap: 5px;
  background: #161616;
  border: 1px solid #222;
  border-radius: 20px;
  padding: 4px 10px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.55rem;
  letter-spacing: 1.5px;
  color: var(--muted);
}
.wake-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--muted);
  transition: background 0.4s;
}
.wake-dot.on {
  background: var(--work);
  box-shadow: 0 0 6px var(--work);
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── SETTINGS ────────────────────────────────────────── */
.settings {
  width: 100%;
  padding: 14px 22px 0;
  overflow: hidden;
  max-height: 220px;
  transition: max-height 0.4s ease, opacity 0.4s ease;
  opacity: 1;
}
.settings.hidden { max-height: 0; opacity: 0; }

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #181818;
}
.row:last-child { border-bottom: none; }
.row label {
  font-size: 0.95rem;
  letter-spacing: 3px;
  color: #666;
}
.inputs { display: flex; align-items: center; gap: 6px; }
.inputs span {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 1px;
}
input[type="number"] {
  width: 50px;
  padding: 7px 4px;
  background: #161616;
  border: 1px solid #252525;
  border-radius: 7px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 1rem;
  text-align: center;
  -webkit-appearance: none;
  appearance: none;
}
input:focus { outline: none; border-color: var(--ready); }

/* ── MAIN STAGE ──────────────────────────────────────── */
.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 0 20px;
  gap: 0;
}

/* ── COUNTDOWN SPLASH (3-2-1) ───────────────────────── */
#countdown-splash {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: absolute;
  inset: 0;
  z-index: 50;
  background: var(--bg);
}
#countdown-splash.visible { display: flex; }

.splash-number {
  font-size: min(45vw, 220px);
  line-height: 1;
  color: var(--ready);
  text-shadow: 0 0 60px rgba(41,121,255,0.5);
  animation: pop-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
@keyframes pop-in {
  from { transform: scale(1.6); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.splash-label {
  font-size: 1.2rem;
  letter-spacing: 8px;
  color: #555;
  margin-top: -10px;
}

/* ── STATUS + ROUND ─────────────────────────────────── */
.status-wrap {
  text-align: center;
  margin-bottom: 8px;
}
#status-text {
  font-size: clamp(2rem, 10vw, 3rem);
  letter-spacing: 5px;
  color: var(--current);
  transition: color 0.25s;
}
#round-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(1.4rem, 7vw, 2rem);
  letter-spacing: 4px;
  margin-top: 4px;
}
#round-text .cur {
  color: var(--current);
  font-size: 1.3em;
  transition: color 0.25s;
  text-shadow: 0 0 16px var(--current);
}
#round-text .sep { color: #333; margin: 0 3px; }
#round-text .tot { color: #555; }

/* ── RING ────────────────────────────────────────────── */
.ring-wrap {
  position: relative;
  width: min(80vw, 320px);
  height: min(80vw, 320px);
}
.ring-svg {
  width: 100%; height: 100%;
  /* rotate(-90deg) starts at top. scaleX(-1) flips so arc goes clockwise (drains clockwise) */
  transform: rotate(-90deg) scaleX(-1);
  overflow: visible;
}
.ring-bg {
  fill: none;
  stroke: #1c1c1c;
  stroke-width: 4.5;
}
.ring-track {
  fill: none;
  stroke: var(--current);
  stroke-width: 4.5;
  stroke-linecap: round;
  transition: stroke 0.3s ease;
}
/* Glow duplicate */
.ring-glow {
  fill: none;
  stroke: var(--current);
  stroke-width: 8;
  stroke-linecap: round;
  opacity: 0.18;
  transition: stroke 0.3s ease;
}

.timer-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#timer-display {
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(2.4rem, 12vw, 4.4rem);
  color: var(--current);
  transition: color 0.25s, font-size 0.2s ease;
  letter-spacing: 2px;
  line-height: 1;
  text-shadow: 0 0 24px currentColor;
}
#timer-display.big {
  font-size: clamp(2.8rem, 14vw, 5.2rem);
  letter-spacing: 2px;
}

/* ── BUTTONS ─────────────────────────────────────────── */
.btn-row {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
  justify-content: center;
}
button {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 2px;
  padding: 12px 22px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  color: #fff;
  min-width: 100px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5);
  transition: transform 0.1s, opacity 0.15s;
  -webkit-tap-highlight-color: transparent;
}
button:active { transform: scale(0.94); }
button:hover  { opacity: 0.85; }
.btn-start  { background: #00c853; color: #000; }
.btn-pause  { background: #e65100; }
.btn-resume { background: #1565c0; }
.btn-stop   { background: #b71c1c; }
.btn-reset  { background: #1e1e1e; border: 1px solid #2a2a2a; }

/* ── PWA TIP ─────────────────────────────────────────── */
.tip {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 1.5px;
  color: #272727;
  text-align: center;
  padding: 12px 20px;
  line-height: 1.7;
}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════
   AUDIO ENGINE — iOS background-safe
   
   The problem: iOS suspends AudioContext when the app goes to
   background or screen dims, even in PWA mode.
   
   The fix: Once the user taps START (gesture unlocks audio),
   we schedule a recurring 1-sample silent buffer every 20s.
   This "pings" the audio session just often enough to keep it
   alive without claiming audio focus — so Spotify keeps playing.
   
   Unlike a looping buffer, this approach:
   - Does NOT interrupt background music (uses same session)
   - Survives iOS background throttling
   - Costs almost zero CPU
═══════════════════════════════════════════════════════════════ */
let AC = null;
let audioUnlocked = false;
let keepAliveTimer = null;

function ensureAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)({
        // 'ambient' category on iOS = mixes with other audio, doesn't duck Spotify
        latencyHint: 'interactive'
      });
    } catch(e) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
    }
  }
  if (AC.state === 'suspended') AC.resume();
}

function keepAlive() {
  if (!AC || !isRunning) return;
  if (AC.state === 'suspended') AC.resume();
  // Schedule a 1-sample silent buffer — just enough to ping the session
  try {
    const buf = AC.createBuffer(1, 1, AC.sampleRate);
    const src = AC.createBufferSource();
    src.buffer = buf;
    src.connect(AC.destination);
    src.start();
  } catch(e) {}
  // Reschedule — every 20s is enough to prevent iOS from closing the session
  keepAliveTimer = setTimeout(keepAlive, 20000);
}

function startKeepAlive() {
  stopKeepAlive();
  keepAlive();
}

function stopKeepAlive() {
  if (keepAliveTimer) { clearTimeout(keepAliveTimer); keepAliveTimer = null; }
}

function unlockAudio() {
  if (audioUnlocked) return;
  ensureAudio();
  // Play silent primer on the gesture — this opens the iOS audio session
  const buf = AC.createBuffer(1, 1, AC.sampleRate);
  const src = AC.createBufferSource();
  src.buffer = buf;
  src.connect(AC.destination);
  src.start(0);
  audioUnlocked = true;
  startKeepAlive();
}

// Re-open audio session if page becomes visible again
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && AC) {
    AC.resume().catch(() => {});
    if (isRunning) startKeepAlive();
  }
});

/*
  Sounds — clean single tones:
  'tick'   — short sharp beep (3-2-1 countdown and end-of-phase 3-2-1)
  'start'  — one punchy beep when WORK begins
  'switch' — different pitch when REST begins
  'done'   — one long sustained tone to signal workout complete
*/
function beep(type) {
  ensureAudio();
  if (AC.state === 'suspended') { AC.resume(); }
  const t = AC.currentTime;

  if      (type === 'tick')   singleBeep(3500, 0.9, t, 0.07);
  else if (type === 'start')  singleBeep(3000, 1.0, t, 0.14);
  else if (type === 'switch') singleBeep(1800, 1.0, t, 0.18);
  else if (type === 'done')   singleBeep(880,  1.0, t, 1.2);
}

function singleBeep(freq, vol, startAt, dur) {
  try {
    const osc  = AC.createOscillator();
    const gain = AC.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, startAt);
    gain.gain.setValueAtTime(0.0001, startAt);
    gain.gain.linearRampToValueAtTime(vol, startAt + 0.003);
    gain.gain.setValueAtTime(vol, startAt + dur * 0.65);
    gain.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
    osc.connect(gain);
    gain.connect(AC.destination);
    osc.start(startAt);
    osc.stop(startAt + dur + 0.01);
  } catch(e) {}
}


/* ═══════════════════════════════════════════════════════════════
   WAKE LOCK
═══════════════════════════════════════════════════════════════ */
let wakeLock = null;
async function reqWake() {
  if ('wakeLock' in navigator) {
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wake-dot').classList.add('on');
      document.getElementById('wake-lbl').textContent = 'SCHERM AAN: AAN';
      wakeLock.addEventListener('release', () => {
        document.getElementById('wake-dot').classList.remove('on');
        document.getElementById('wake-lbl').textContent = 'SCHERM AAN: UIT';
      });
    } catch(e) {}
  }
}
function dropWake() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}


/* ═══════════════════════════════════════════════════════════════
   RING ANIMATION
   The ring uses CSS animation (linear, exact duration) so it
   sweeps perfectly smoothly — no per-frame JS jitter.
═══════════════════════════════════════════════════════════════ */
const CIRC = 2 * Math.PI * 44; // 276.46

let ringAnim = null; // current CSS animation reference via style injection

function startRingAnimation(durationSec) {
  // Always starts from offset=0 (full ring) — used when a phase begins fresh
  _animateRing(0, durationSec);
}

function resumeRingAnimation(durationSec) {
  // Starts from wherever the ring was frozen at pause
  const fromOffset = pausedOffset !== null ? pausedOffset : 0;
  _animateRing(fromOffset, durationSec);
  pausedOffset = null;
}

function _animateRing(fromOffset, durationSec) {
  const track = document.getElementById('ring-track');
  const glow  = document.getElementById('ring-glow');

  track.style.animation = 'none';
  glow.style.animation  = 'none';
  track.style.strokeDashoffset = fromOffset;
  glow.style.strokeDashoffset  = fromOffset;
  // Force reflow so the browser registers the new start value
  track.getBoundingClientRect();

  const id = 'kf_' + Date.now();
  const style = document.createElement('style');
  style.id = id;
  style.textContent = `
    @keyframes ${id} {
      from { stroke-dashoffset: ${fromOffset}; }
      to   { stroke-dashoffset: ${CIRC}; }
    }
  `;
  document.head.appendChild(style);
  if (ringAnim) document.getElementById(ringAnim)?.remove();
  ringAnim = id;

  const anim = `${id} ${durationSec}s linear forwards`;
  track.style.animation = anim;
  glow.style.animation  = anim;
}

function stopRing(fillPercent = 0) {
  const track = document.getElementById('ring-track');
  const glow  = document.getElementById('ring-glow');
  track.style.animation = 'none';
  glow.style.animation  = 'none';
  const offset = CIRC * (1 - fillPercent);
  track.style.strokeDashoffset = offset;
  glow.style.strokeDashoffset  = offset;
}

function setRingColor(phase) {
  const c = phase === 'werk' ? 'var(--work)' :
            phase === 'rust' ? 'var(--rest)' :
                               'var(--ready)';
  document.documentElement.style.setProperty('--current', c);
}

/* ═══════════════════════════════════════════════════════════════
   TIMER STATE
═══════════════════════════════════════════════════════════════ */
let loop = null;
let isRunning   = false;
let phase       = 'idle';   // idle | countdown | werk | rust | done
let curRound    = 1;
let totalRounds = 8;
let werkSec     = 20;
let rustSec     = 10;
let phaseEndTime = 0;
let phaseTotalSec = 0;
let lastBeepSec = -1;

function readInputs() {
  werkSec     = (parseInt(document.getElementById('werk-min').value) * 60)
              +  parseInt(document.getElementById('werk-sec').value);
  rustSec     = (parseInt(document.getElementById('rust-min').value) * 60)
              +  parseInt(document.getElementById('rust-sec').value);
  totalRounds = parseInt(document.getElementById('rondes').value);
  if (!werkSec) werkSec = 20;
  if (!rustSec) rustSec = 10;
  if (!totalRounds || totalRounds < 1) totalRounds = 1;
}

function fmt(s) {
  return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

function setStatus(text, ph) {
  document.getElementById('status-text').textContent = text;
  setRingColor(ph);
  document.getElementById('timer-display').style.color = 'var(--current)';
}

function setRound(cur, tot) {
  const el = document.getElementById('round-text');
  if (cur > 0 && tot > 0) {
    el.innerHTML = `<span class="cur">${cur}</span><span class="sep">/</span><span class="tot">${tot}</span>`;
  } else {
    el.innerHTML = `<span class="cur">—</span><span class="sep">/</span><span class="tot">—</span>`;
  }
}

function showTime(sec) {
  document.getElementById('timer-display').textContent = fmt(sec);
}

/* ─── Countdown splash (3-2-1) ────────────────────────── */
let splashTimer = null;
function runCountdown(cb) {
  const splash = document.getElementById('countdown-splash');
  const numEl  = document.getElementById('splash-num');
  splash.classList.add('visible');
  let n = 3;

  function tick() {
    numEl.textContent = n;
    // Restart animation
    numEl.style.animation = 'none';
    numEl.getBoundingClientRect();
    numEl.style.animation = '';

    beep('tick');

    if (n === 0) {
      splash.classList.remove('visible');
      cb();
      return;
    }
    n--;
    splashTimer = setTimeout(tick, 1000);
  }
  tick();
}

/* ─── Phase transitions ───────────────────────────────── */
function beginPhase(ph, sec, round) {
  phase         = ph;
  curRound      = round;
  phaseTotalSec = sec;
  phaseEndTime  = Date.now() + sec * 1000;
  lastBeepSec   = sec + 1;

  setRingColor(ph);
  startRingAnimation(sec);

  if (ph === 'werk') {
    setStatus('WORK!', 'werk');
    document.getElementById('timer-display').classList.add('big');
    beep('start');
  } else if (ph === 'rust') {
    setStatus('REST', 'rust');
    document.getElementById('timer-display').classList.remove('big');
    beep('switch');
  }
  setRound(round, totalRounds);
  showTime(sec);
}

function startMainLoop() {
  clearInterval(loop);
  loop = setInterval(() => {
    const remaining = Math.max(0, Math.ceil((phaseEndTime - Date.now()) / 1000));

    // Countdown beeps 3-2-1
    if (remaining > 0 && remaining <= 3 && remaining !== lastBeepSec) {
      beep('tick');
      lastBeepSec = remaining;
    }

    showTime(remaining);

    if (remaining <= 0) {
      // Phase complete
      if (phase === 'werk') {
        beginPhase('rust', rustSec, curRound);
      } else if (phase === 'rust') {
        const nextRound = curRound + 1;
        if (nextRound > totalRounds) {
          finishWorkout();
        } else {
          beginPhase('werk', werkSec, nextRound);
        }
      }
    }
  }, 50);
}

function finishWorkout() {
  clearInterval(loop);
  isRunning = false;
  phase = 'done';
  stopRing(0);
  beep('done');
  setStatus('DONE!', 'ready');
  setRound(totalRounds, totalRounds);
  document.getElementById('timer-display').textContent = 'DONE';
  document.getElementById('timer-display').classList.remove('big');
  dropWake();
  btnState('done');
}

/* ═══════════════════════════════════════════════════════════════
   BUTTON ACTIONS
═══════════════════════════════════════════════════════════════ */
function btnState(state) {
  const show = id => document.getElementById(id).style.display = 'block';
  const hide = id => document.getElementById(id).style.display = 'none';
  ['btn-start','btn-pause','btn-resume','btn-reset','btn-stop'].forEach(hide);
  if (state === 'idle')    { show('btn-start'); }
  if (state === 'running') { show('btn-pause'); show('btn-stop'); }
  if (state === 'paused')  { show('btn-resume'); show('btn-reset'); }
  if (state === 'done')    { show('btn-reset'); }
}

function onStart() {
  unlockAudio();  // unlock iOS audio on user gesture
  readInputs();

  document.getElementById('settings').classList.add('hidden');
  document.getElementById('tip').style.display = 'none';
  btnState('running');
  reqWake();

  isRunning = true;
  curRound = 1;
  setRound(1, totalRounds);
  setStatus('GET READY', 'ready');
  stopRing(1);

  runCountdown(() => {
    beginPhase('werk', werkSec, 1);
    startMainLoop();
  });
}

let pausedOffset = null; // stroke-dashoffset value frozen at pause

function onPause() {
  clearInterval(loop);
  clearTimeout(splashTimer);
  document.getElementById('countdown-splash').classList.remove('visible');

  // Read the COMPUTED (mid-animation) offset value and freeze it
  const track = document.getElementById('ring-track');
  const glow  = document.getElementById('ring-glow');
  const liveOffset = parseFloat(getComputedStyle(track).strokeDashoffset);
  pausedOffset = isNaN(liveOffset) ? 0 : liveOffset;

  track.style.animation = 'none';
  glow.style.animation  = 'none';
  track.style.strokeDashoffset = pausedOffset;
  glow.style.strokeDashoffset  = pausedOffset;

  isRunning = false;
  dropWake();
  setStatus('PAUSED', phase);
  document.getElementById('settings').classList.remove('hidden');
  btnState('paused');
}

function onResume() {
  unlockAudio();
  document.getElementById('settings').classList.add('hidden');
  isRunning = true;
  reqWake();

  // Remaining seconds based on wall clock
  const remaining = Math.max(1, Math.ceil((phaseEndTime - Date.now()) / 1000));
  // Rebase end time from now
  phaseEndTime = Date.now() + remaining * 1000;

  // Resume ring FROM the frozen offset position
  resumeRingAnimation(remaining);

  if (phase === 'werk') setStatus('WORK!', 'werk');
  else if (phase === 'rust') setStatus('REST', 'rust');

  btnState('running');
  startMainLoop();
}

function onStop() {
  clearInterval(loop);
  clearTimeout(splashTimer);
  document.getElementById('countdown-splash').classList.remove('visible');
  isRunning = false;
  phase = 'idle';
  stopKeepAlive();
  dropWake();
  reset();
}

function onReset() { onStop(); }

function reset() {
  stopRing(1);
  setStatus('READY?', 'ready');
  setRound(0, 0);
  showTime(0);
  document.getElementById('timer-display').textContent = '00:00';
  document.getElementById('timer-display').classList.remove('big');
  document.getElementById('settings').classList.remove('hidden');
  document.getElementById('tip').style.display = 'block';
  btnState('idle');
}

/* ═══════════════════════════════════════════════════════════════
   VISIBILITY — wake lock recovery
   (Audio visibilitychange is handled in the audio engine above)
═══════════════════════════════════════════════════════════════ */
document.addEventListener('visibilitychange', async () => {
  if (!document.hidden && isRunning) {
    await reqWake();
  }
});

// Init
reset();
</script>
